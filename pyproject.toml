[project]
name = "subsea-telemetry-api"
version = "0.1.0"
description = "REST API for subsea equipment telemetry: registry, time-series ingestion and operating-envelope alerts"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Without this, `pytest` only works when invoked as `python -m pytest`, which
# silently puts the CWD on sys.path. CI calls the bare entry point.
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"
