name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: subsea
                    POSTGRES_PASSWORD: subsea
                    POSTGRES_DB: subsea_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U subsea"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
                  cache: pip

            - run: pip install -r requirements-dev.txt

            - name: Lint
              run: ruff check app scripts tests

            - name: Migrations apply cleanly
              env:
                  DATABASE_URL: postgresql+asyncpg://subsea:subsea@localhost:5432/subsea_test
              run: alembic upgrade head

            # The suite runs twice: SQLite keeps it portable, Postgres is what
            # the app actually ships on.
            - name: Tests (SQLite)
              run: pytest -q

            - name: Tests (PostgreSQL)
              env:
                  TEST_DATABASE_URL: postgresql+asyncpg://subsea:subsea@localhost:5432/subsea_test
              run: pytest -q --cov=app --cov-report=term-missing
