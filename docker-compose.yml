services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: subsea
            POSTGRES_PASSWORD: subsea
            POSTGRES_DB: subsea
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U subsea -d subsea']
            interval: 5s
            timeout: 3s
            retries: 10

    api:
        build: .
        environment:
            DATABASE_URL: postgresql+asyncpg://subsea:subsea@db:5432/subsea
            DEBUG: 'false'
        ports:
            - '8000:8000'
        depends_on:
            db:
                condition: service_healthy
        # Migrations run on boot so a fresh clone is one command away from a
        # working API.
        command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
    pgdata:
